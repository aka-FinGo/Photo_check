name: Build Android APK (PhotoCheck)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      apk_type:
        description: 'Chiqariladigan APK turini tanlang:'
        required: true
        default: 'my_phone'
        type: choice
        options:
          - 'my_phone'    # Mening telefonim uchun (Faqat bitta ARM64-v8a APK)
          - 'universal'   # Universal APK (Barcha Android telefonlar uchun)
          - 'both'        # Ikkala APK variantini ham alohida tayyorlash

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyani yuklash (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 (JDK) o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.4 o'rnatish (Kesh o'chirilgan)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: APK-ni yig'ish (Assemble APK)
        run: |
          cd android-app
          gradle assembleDebug --stacktrace

      - name: Fayllarni ajratish va nomlash
        run: |
          mkdir -p dist
          FOUND_APK=$(find android-app/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $FOUND_APK"
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" dist/PhotoCheck-MyPhone-arm64-v8a.apk
            cp "$FOUND_APK" dist/PhotoCheck-Universal.apk
          else
            echo "No APK generated"
            exit 1
          fi

      - name: 📱 Mening telefonim uchun APK (ARM64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCheck-MyPhone-arm64-v8a
          path: dist/PhotoCheck-MyPhone-arm64-v8a.apk
          retention-days: 7

      - name: 🌐 Universal APK (Barcha telefonlar uchun)
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCheck-Universal
          path: dist/PhotoCheck-Universal.apk
          retention-days: 7
