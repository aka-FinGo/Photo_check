name: Build Android APK (PhotoCheck)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      apk_type:
        description: 'Chiqariladigan APK turini tanlang:'
        required: true
        default: 'my_phone'
        type: choice
        options:
          - 'my_phone'    # Mening telefonim uchun (Faqat bitta ARM64-v8a APK)
          - 'universal'   # Universal APK (Barcha Android telefonlar uchun)
          - 'both'        # Ikkala APK variantini ham alohida tayyorlash

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyani yuklash (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 (JDK) o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: APK-ni yig'ish (Assemble APK)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Fayllarni ajratish va nomlash
        run: |
          mkdir -p dist
          APK_DIR="android-app/app/build/outputs/apk/debug"
          
          ARM64_FILE=$(find $APK_DIR -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "$ARM64_FILE" ]; then
            ARM64_FILE=$(find $APK_DIR -name "app-debug.apk" | head -n 1)
          fi
          if [ -n "$ARM64_FILE" ]; then
            cp "$ARM64_FILE" dist/PhotoCheck-MyPhone-arm64-v8a.apk
          fi

          UNIVERSAL_FILE=$(find $APK_DIR -name "*universal*.apk" | head -n 1)
          if [ -z "$UNIVERSAL_FILE" ]; then
            UNIVERSAL_FILE=$(find $APK_DIR -name "app-debug.apk" | head -n 1)
          fi
          if [ -n "$UNIVERSAL_FILE" ]; then
            cp "$UNIVERSAL_FILE" dist/PhotoCheck-Universal.apk
          fi

      - name: 📱 Mening telefonim uchun APK (ARM64-v8a)
        if: github.event_name == 'push' || github.event.inputs.apk_type == 'my_phone' || github.event.inputs.apk_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCheck-MyPhone-arm64-v8a
          path: dist/PhotoCheck-MyPhone-arm64-v8a.apk
          retention-days: 7

      - name: 🌐 Universal APK (Barcha telefonlar uchun)
        if: github.event_name == 'push' || github.event.inputs.apk_type == 'universal' || github.event.inputs.apk_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCheck-Universal
          path: dist/PhotoCheck-Universal.apk
          retention-days: 7
