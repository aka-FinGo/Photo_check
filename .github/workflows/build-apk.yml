name: Build Android APK (PhotoCheck)

on:
  workflow_dispatch: # Manual trigger only (qo'lda bosilganda yig'iladi)

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyani yuklash (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17 (JDK) o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: APK-ni yig'ish (Assemble APK)
        run: |
          cd android-app
          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/.gradle_home"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon > build_log.txt 2>&1 || {
            echo "=== BUILD FAILED: PUSHING LOGS TO BRANCH ==="
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b build-logs || git checkout build-logs
            cp build_log.txt ../build_log.txt
            cd ..
            git add build_log.txt
            git commit -m "Upload build failure log"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/aka-FinGo/Photo_check.git build-logs --force
            exit 1
          }

      - name: Fayllarni ajratish va nomlash
        run: |
          mkdir -p dist
          FOUND_APK=$(find android-app/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $FOUND_APK"
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" dist/PhotoCheck.apk
          else
            echo "No APK generated"
            exit 1
          fi

      - name: 📱 PhotoCheck APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCheck-APK
          path: dist/PhotoCheck.apk
          retention-days: 7
