name: Build & Release PhotoCheck APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyani yuklash (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17 (JDK) o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dinamik Versiya Raqamini Belgilash (+1.0.XX)
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          # Hisoblash: 1 -> 1.0.01, 2 -> 1.0.02, 55 -> 1.0.55
          VERSION_NAME=$(printf "1.0.%02d" "$RUN_NUM")
          VERSION_CODE="$RUN_NUM"
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          
          echo "=========================================="
          echo "📦 Boshlanmoqda: PhotoCheck v$VERSION_NAME (Code: $VERSION_CODE)"
          echo "=========================================="

      - name: Release Keystore tekshirish
        run: |
          mkdir -p android-app/app/keystore
          if [ ! -f android-app/app/keystore/photocheck.jks ]; then
            echo "Keystore yaratilmoqda..."
            keytool -genkeypair -v \
              -keystore android-app/app/keystore/photocheck.jks \
              -alias photocheck \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass photocheck123 \
              -keypass photocheck123 \
              -dname "CN=PhotoCheck, OU=FinGo, O=FinGo, L=Tashkent, ST=Tashkent, C=UZ"
          else
            echo "Mavjud doimiy photocheck.jks topildi."
          fi

      - name: Release APK-ni yig'ish (Assemble Release)
        run: |
          cd android-app
          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/.gradle_home"
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCode="${{ env.VERSION_CODE }}" \
            -PversionName="${{ env.VERSION_NAME }}" \
            -PKEYSTORE_FILE="keystore/photocheck.jks" \
            -PKEYSTORE_PASSWORD="photocheck123" \
            -PKEY_ALIAS="photocheck" \
            -PKEY_PASSWORD="photocheck123" \
            --stacktrace --no-daemon

      - name: APK fayllarini ajratish va tayyorlash
        run: |
          mkdir -p dist
          echo "=== Yig'ilgan APK fayllar ro'yxati ==="
          find android-app/app/build/outputs/apk -type f -name "*.apk" -ls
          
          # Universal APK ni qidirish
          UNIVERSAL_APK=$(find android-app/app/build/outputs/apk -name "*universal*.apk" | head -n 1)
          if [ -z "$UNIVERSAL_APK" ]; then
            UNIVERSAL_APK=$(find android-app/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$UNIVERSAL_APK" ]; then
            echo "Asosiy Universal APK topildi: $UNIVERSAL_APK"
            cp "$UNIVERSAL_APK" dist/PhotoCheck.apk
            cp "$UNIVERSAL_APK" "dist/PhotoCheck-v${{ env.VERSION_NAME }}.apk"
          else
            echo "Xatolik: Hech qanday APK topilmadi!"
            exit 1
          fi
          
          # Barcha split APK fayllarni dist ga nusxalash
          for apk in $(find android-app/app/build/outputs/apk -name "*.apk"); do
            fname=$(basename "$apk")
            cp "$apk" "dist/$fname"
          done
          
          echo "=== Tayyorlangan dist fayllari ==="
          ls -la dist/

      - name: 📱 PhotoCheck APK Artifacts-ga yuklash
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCheck-v${{ env.VERSION_NAME }}-APK
          path: dist/*
          retention-days: 14

      - name: 🚀 GitHub Release va In-App Update uchun nashr qilish
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "PhotoCheck v${{ env.VERSION_NAME }}"
          body: |
            ## 📱 PhotoCheck v${{ env.VERSION_NAME }} (Build #${{ env.VERSION_CODE }})

            ### 🚀 Yangilanishlar va Imkoniyatlar:
            * **Gorizontal Silliq Surish (Swipe):** Mi Gallery uslubida rasmlar va videolarni chapga/o'ngga erkin surish.
            * **Pinch-to-Zoom:** Rasmlarni 2 barmoq bilan yoki 2 marta bosib kattalashtirib ko'rish.
            * **Gamburger Menyusi & Bento Vidjet:** Ota-ona sozlamalarida tartibli boshqaruv, yo'riqnoma va statistika.
            * **In-App Updater:** Dastur ichidan to'g'ridan-to'g'ri yangilanishlarni qabul qilish.
            * **Bolalar Xavfsiz Galereyasi:** Biometrik qulf, ota-ona nazorati va uxlash vaqti taymeri.
            * **PhotoCheck Pro:** 1:1 Slidebox saralash, savat va albomlar boshqaruvi.

            ---
            *Avtomatik tarzda GitHub Actions CI/CD orqali yig'ilgan va imzolangan.*
          files: |
            dist/PhotoCheck.apk
            dist/PhotoCheck-v${{ env.VERSION_NAME }}.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
