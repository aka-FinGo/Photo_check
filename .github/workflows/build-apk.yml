name: Build Android APK (PhotoCheck)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyani yuklash (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 (JDK) o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: APK-ni yig'ish (Assemble APK)
        run: |
          cd android-app
          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/.gradle_home"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon > build_log.txt 2>&1 || {
            echo "=== BUILD FAILED: PRINTING LOGS ==="
            cat build_log.txt
            exit 1
          }

      - name: Fayllarni ajratish va nomlash
        run: |
          mkdir -p dist
          FOUND_APK=$(find android-app/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $FOUND_APK"
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" dist/PhotoCheck-MyPhone-arm64-v8a.apk
            cp "$FOUND_APK" dist/PhotoCheck-Universal.apk
          else
            echo "No APK generated"
            exit 1
          fi

      - name: 📱 Mening telefonim uchun APK (ARM64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCheck-MyPhone-arm64-v8a
          path: dist/PhotoCheck-MyPhone-arm64-v8a.apk
          retention-days: 7

      - name: 🌐 Universal APK (Barcha telefonlar uchun)
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCheck-Universal
          path: dist/PhotoCheck-Universal.apk
          retention-days: 7
